<script type="module">

const W=1080,H=1920

renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap

const scene=new THREE.Scene()

const flat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.7,...o})

const kb=new THREE.Group();scene.add(kb)
const base=new THREE.Mesh(new THREE.BoxGeometry(16,.5,7),flat('#15151f'));base.position.y=-.25;base.receiveShadow=true;kb.add(base)
const keyM=flat('#232333'),keyTop=flat('#2b2b3e')
const glowM=new THREE.MeshBasicMaterial({color:'#6D4AFF'})
for(let r=0;r<5;r++)for(let c=0;c<13;c++){
  const isSpace=r===4&&c>=4&&c<=8; if(r===4&&c>4&&c<=8)continue
  const w=isSpace?5.6:1.0
  const k=new THREE.Mesh(new THREE.BoxGeometry(w,.32,1.0),keyM)
  k.position.set(-7.2+c*1.2+(isSpace?2.4:0),.16,-2.6+r*1.2);k.castShadow=k.receiveShadow=true;kb.add(k)
  const g=new THREE.Mesh(new THREE.BoxGeometry(w+.08,.04,1.08),glowM);g.position.set(k.position.x,.01,k.position.z);kb.add(g)
}
// monitor
const cv=document.createElement('canvas');cv.width=1024;cv.height=640;const cx=cv.getContext('2d')
cx.fillStyle='#0f0f1c';cx.fillRect(0,0,1024,640)
cx.font='28px monospace';const lines=['> deploy --prod','  building... ok','  ssl ........ ok','  live: yourbusiness.harnova.my','','> client: "can do like Shopee?"','  budget: RM500','','> nova: ...']
lines.forEach((l,i)=>{cx.fillStyle=l.includes('client')?'#FF7AB0':l.includes('nova')?'#7DD3FC':'#b9b6d8';cx.fillText(l,40,70+i*58)})

const bez=new THREE.Mesh(new THREE.BoxGeometry(13,8,.4),flat('#101018'));mon.add(bez)
const scr=new THREE.Mesh(new THREE.PlaneGeometry(12.4,7.4),new THREE.MeshBasicMaterial({map:tex,color:'#5d5d70'}));scr.position.z=.21;mon.add(scr)
// teh tarik cup
const cup=new THREE.Group();cup.position.set(5.6,0,-1.2);scene.add(cup)
const glass=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.0,3.6,10,1,true),new THREE.MeshStandardMaterial({color:'#ffffff',transparent:true,opacity:.18,roughness:.1,flatShading:true,side:THREE.DoubleSide}));glass.position.y=1.8;cup.add(glass)
const tea=new THREE.Mesh(new THREE.CylinderGeometry(1.17,1.0,2.9,10),flat('#b8763a'));tea.position.y=1.45;cup.add(tea)
const foam=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.17,.35,10),flat('#f2dcb8'));foam.position.y=3.05;cup.add(foam)
// stars
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<300;i++)sp.push((Math.random()-.5)*60,Math.random()*25,-15-Math.random()*10)
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:'#ffffff',size:.06})))

// ── NOVA ──
function starShape(s){const sh=new THREE.Shape(),p=(x,y)=>[x*s,y*s]
 sh.moveTo(...p(0,1));sh.bezierCurveTo(...p(.09,.42),...p(.42,.09),...p(1,0));sh.bezierCurveTo(...p(.42,-.09),...p(.09,-.42),...p(0,-1))
 sh.bezierCurveTo(...p(-.09,-.42),...p(-.42,-.09),...p(-1,0));sh.bezierCurveTo(...p(-.42,.09),...p(-.09,.42),...p(0,1));return sh}
const nova=new THREE.Group();scene.add(nova)
const body=new THREE.Group();nova.add(body)
const sg2=new THREE.ExtrudeGeometry(starShape(1),{depth:.38,bevelEnabled:true,bevelThickness:.16,bevelSize:.12,bevelSegments:2,curveSegments:5})
sg2.translate(0,0,-.19)
const nv=sg2.toNonIndexed();const pos=nv.attributes.position,cols=[]
const A=new THREE.Color('#FF3D8B'),B=new THREE.Color('#6D4AFF'),C=new THREE.Color('#22B8E6'),tmp=new THREE.Color()
for(let i=0;i<pos.count;i++){const t=THREE.MathUtils.clamp((pos.getX(i)-pos.getY(i)+1.1)/2.2,0,1)
 t<.5?tmp.copy(A).lerp(B,t*2):tmp.copy(B).lerp(C,(t-.5)*2);cols.push(tmp.r,tmp.g,tmp.b)}
nv.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));nv.computeVertexNormals()
const starMesh=new THREE.Mesh(nv,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.45,emissive:'#3a1d8a',emissiveIntensity:.25}))
starMesh.castShadow=true;body.add(starMesh)
// eye
const eyeW=new THREE.Mesh(new THREE.CircleGeometry(.24,16),new THREE.MeshBasicMaterial({color:'#ffffff'}));eyeW.position.set(0,.05,.37);body.add(eyeW)
const pupil=new THREE.Mesh(new THREE.CircleGeometry(.11,12),new THREE.MeshBasicMaterial({color:'#0D0D12'}));pupil.position.set(0,.05,.38);body.add(pupil)
const lid=new THREE.Mesh(new THREE.PlaneGeometry(.56,.3),new THREE.MeshBasicMaterial({color:'#5a3fd6'}));
const coreLight=new THREE.PointLight('#c9b8ff',4,3);coreLight.position.set(0,0,.8);body.add(coreLight)
// legs
const legM=flat('#2a1f66')
const legs=[-.3,.3].map(x=>{const l=new THREE.Group();l.position.set(x,-.75,0);const m=new THREE.Mesh(new THREE.BoxGeometry(.16,.5,.16),legM);m.position.y=-.25;m.castShadow=true;l.add(m)
 const f=new THREE.Mesh(new THREE.BoxGeometry(.26,.12,.34),flat('#f5f4f0'));f.position.set(0,-.52,.06);f.castShadow=true;l.add(f);nova.add(l);return l})
body.position.y=.0;nova.position.set(0,1.68,1.3)

// ── BOSS ── low-poly client in batik shirt with phone
const bc=document.createElement('canvas');bc.width=256;bc.height=256;const b2=bc.getContext('2d')
b2.fillStyle='#1f6e6a';b2.fillRect(0,0,256,256)
for(let y=0;y<256;y+=64)for(let x=0;x<256;x+=64){b2.strokeStyle='#f2c14e';b2.lineWidth=6;b2.beginPath();b2.arc(x+32,y+32,20,0,Math.PI*2);b2.stroke();b2.fillStyle='#e85d3a';b2.beginPath();b2.arc(x+32,y+32,8,0,Math.PI*2);b2.fill()}
const batik=new THREE.CanvasTexture(bc);batik.colorSpace=THREE.SRGBColorSpace;batik.wrapS=batik.wrapT=THREE.RepeatWrapping;batik.repeat.set(1.5,1.5)
const boss=new THREE.Group();scene.add(boss);boss.position.set(-1.75,.32,.7);boss.rotation.y=.5
const skin=flat('#c98c5e')
const torso=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.7),new THREE.MeshStandardMaterial({map:batik,flatShading:true,roughness:.8}));torso.position.y=1.35;torso.castShadow=true;boss.add(torso)
const head=new THREE.Group();head.position.y=2.35;boss.add(head)
const hm=new THREE.Mesh(new THREE.IcosahedronGeometry(.48,0),skin);hm.scale.set(1,1.08,1);hm.castShadow=true;head.add(hm)
const hair=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,0),flat('#1b1410'));hair.scale.set(1.02,.55,1.02);hair.position.y=.25;head.add(hair)
const eyeM=new THREE.MeshBasicMaterial({color:'#0D0D12'});[-.16,.16].forEach(x=>{const e=new THREE.Mesh(new THREE.BoxGeometry(.08,.11,.02),eyeM);e.position.set(x,.02,.45);head.add(e)})
const mouth=new THREE.Mesh(new THREE.BoxGeometry(.2,.04,.02),eyeM);mouth.position.set(0,-.2,.44);head.add(mouth)
const pants=flat('#2b2b38');[-.27,.27].forEach(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.75,.45),pants);l.position.set(x,.38,0);l.castShadow=true;boss.add(l)
 const s=new THREE.Mesh(new THREE.BoxGeometry(.42,.14,.6),flat('#121218'));s.position.set(x,.03,.06);boss.add(s)})
const armL=new THREE.Group();armL.position.set(-.68,1.85,0);boss.add(armL)
const aL=new THREE.Mesh(new THREE.BoxGeometry(.28,.95,.32),new THREE.MeshStandardMaterial({map:batik,flatShading:true}));aL.position.y=-.45;aL.castShadow=true;armL.add(aL)
const armR=new THREE.Group();armR.position.set(.68,1.85,0);boss.add(armR)
const aR=new THREE.Mesh(new THREE.BoxGeometry(.28,.95,.32),new THREE.MeshStandardMaterial({map:batik,flatShading:true}));aR.position.y=-.45;aR.castShadow=true;armR.add(aR)
const hand=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.22),skin);hand.position.y=-1.0;armR.add(hand)
const phone=new THREE.Mesh(new THREE.BoxGeometry(.3,.5,.05),flat('#0D0D12'));phone.position.set(0,-1.05,.18);armR.add(phone)
const phoneScr=new THREE.Mesh(new THREE.PlaneGeometry(.25,.44),new THREE.MeshBasicMaterial({color:'#7DD3FC'}));phoneScr.position.set(0,-1.05,.21);armR.add(phoneScr)

// ── timeline ──
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, clamp01=x=>Math.max(0,Math.min(1,x))
const lerp=(a,b,t)=>a+(b-a)*t, seg=(t,a,b)=>ease(clamp01((t-a)/(b-a)))
const SUBS=[[4.6,6.6,'“Nova. Can you build Shopee?”'],[6.8,8.6,'“Simple one only.”'],[8.8,10.6,'“Budget RM500.”'],[10.8,13.4,'…']]
const sub=document.getElementById('sub'),title=document.getElementById('title'),flash=document.getElementById('flash')
window.renderAt=function(t){
  // turnaround 0-4.2
  let blink=((t%3.1)>2.95)?1:0
  const talk=(s)=>SUBS.some(([a,b])=>t>a&&t<b&&s)
  if(t<4.3){
    const a=-0.6+seg(t,0,4.2)*1.2
    cam.position.set(Math.sin(a)*7.2,2.2+t*.1,1.3+Math.cos(a)*7.2);cam.lookAt(0,1.75,1.3)
    nova.position.y=1.68+Math.max(0,Math.sin(Math.min(1,Math.max(0,(t-1.6)/.6))*Math.PI))*.7
    nova.rotation.y=Math.sin(t*1.2)*.25;boss.visible=false
    title.style.opacity=clamp01((t-.6)/.5)*clamp01((4.1-t)/.4)
  }else{
    boss.visible=true;title.style.opacity=0
    // two-shot, then push in on Nova
    const k=seg(t,10.6,12.2)
    const p0=new THREE.Vector3(-.5,3.0,11.5),p1=new THREE.Vector3(.1,1.9,5.6)
    cam.position.lerpVectors(p0,p1,k);const look=new THREE.Vector3(lerp(-.85,0,k),lerp(1.95,1.75,k),1.0);cam.lookAt(look);nova.position.y=1.68
    nova.rotation.y=lerp(-.35,-.15,k)
  }
  // nova idle bob + squint when budget said
  body.position.y=Math.sin(t*2.4)*.05
  body.rotation.z=Math.sin(t*1.3)*.04
  legs.forEach((l,i)=>l.rotation.x=0)
  const squint=seg(t,9.3,9.8)
  const sq=Math.max(squint*.6,blink);eyeW.scale.y=1-sq*.75;pupil.scale.y=1-sq*.6;pupil.position.y=.05-sq*.02
  pupil.position.x=t>4.3&&t<10.6?-.07:0
  // boss: talking bounce + phone gesture
  const speaking=SUBS.slice(0,3).some(([a,b])=>t>a&&t<b)
  head.rotation.x=speaking?Math.sin(t*14)*.06:0
  mouth.scale.y=speaking?1+Math.abs(Math.sin(t*16))*3:1
  armR.rotation.x=lerp(-.9,-.3,(Math.sin(t*1.5)+1)/2*.4)
  armL.rotation.z=speaking&&t>8.8?-.6-Math.sin(t*6)*.15:-.1
  // subs
  const s=SUBS.find(([a,b])=>t>=a&&t<b);sub.textContent=s?s[2]:'';sub.style.fontSize=(s&&s[2]==='…')?'120px':'58px'
  flash.style.opacity=0
  renderer.render(scene,cam)
}
window.ready=true
renderAt(0)
